defaults:
  - _self_
  - dataset: report-dataset
  - model: qwen3_5

training_arguments:
  optim: "adamw_torch_fused"
  do_train: true
  do_eval: true
  output_dir: "./cpt-checkpoints"
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32
  # eval_accumulation_steps: 4  # no-op when eval only calculates loss, no eval metric
  # Off: qwen3_5 (supports_packing: false) forces it off anyway, and chunks are
  # already filled close to max_length. Can be enabled for qwen3 / llama3.
  packing: false
  max_length: 2048
  dataset_text_field: "text"
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_only_model: true
  save_total_limit: 2
  # LoRA needs a much larger lr than a full fine-tune; 2e-5 barely moves the
  # adapter. Drop to ~2e-5 only if switch to full fine-tuning.
  learning_rate: 1e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 2
  logging_strategy: steps
  tf32: true
  dataloader_num_workers: 0
  dataloader_pin_memory: false
  gradient_checkpointing: true
  disable_tqdm: false
  report_to: "none"
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  torch_compile: false
  seed: 42

# Prepare dataset
prepare:
  auto: true
  force: false # if true: re-chunk even if the prepared files exist
  val_ratio: 0.15
  dedupe: true

  # Remove the administrative frame around each report before chunking
  boilerplate:
    strip: true # if false: keep the frame (header, place/date, recipients, signature)
    min_document_ratio: 0.5 # a short line present in >= this share of documents is corpus template text
    max_line_chars: 120 # longer lines are never template text (PATTERNS ignore this)
    max_strip_ratio: 0.25 # if stripping would remove more chars than this, keep the document as-is

merge:
  enabled: true
  output_dir: # null -> "<training_arguments.output_dir>-merged"
  dtype: bfloat16
  evaluate_merged: true

early_stopping_patience: 0 # disables
seed: 42
deterministic: false
token: null
logging:
  mlflow:
    experiment_name: "llm-cpt"
