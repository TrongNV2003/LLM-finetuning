model_name_or_path: meta-llama/Llama-3.2-1B-Instruct
model_class: causal_lm
padding_side: right
model_max_length: 2048
cache_dir:
revision:
use_fast_tokenizer: true
trust_remote_code: false
use_cache: false
attn_implementation: flash_attention_2
supports_packing: true

chat_template_kwargs: {} # no thinking switch in this template

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  modules_to_save:
  use_dora: false
  use_rslora: false

qlora: true
